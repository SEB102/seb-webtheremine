<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SEB-WEBTHEREMINE-DUO</title>
  <style>
    :root { --bg: #0a0a10; --panel: #12121c; --accent: #00e87a; --text: #bbb; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg); color: var(--text);
      font-family: 'Courier New', monospace;
      min-height: 100vh; padding: 8px;
      display: flex; flex-direction: column; align-items: center; gap: 6px;
      touch-action: manipulation; user-select: none;
    }
    h1 { color: var(--accent); font-size: 1em; letter-spacing: .4em; text-transform: uppercase; padding: 6px 0; }
    .duo-wrap { display: flex; gap: 10px; width: 100%; max-width: 1340px; align-items: flex-start; }
    .player-col { flex: 1; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
    .player-label { color: var(--accent); font-weight: bold; font-size: .82em; letter-spacing: .25em; text-align: center; border: 1px solid #1a1a2a; padding: 4px; border-radius: 3px; }
    .video-wrap { position: relative; line-height: 0; border: 1px solid #1a1a2a; width: 100%; }
    .video-wrap video { display: none; }
    .video-wrap canvas { display: block; width: 100%; height: auto; cursor: crosshair; touch-action: none; }
    .panel {
      background: var(--panel); border: 1px solid #1e1e30;
      border-radius: 4px; padding: 7px 10px;
      display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
    }
    button {
      background: transparent; color: var(--accent);
      border: 1px solid var(--accent); padding: 5px 10px;
      cursor: pointer; font-family: monospace; font-size: .82em;
      border-radius: 3px; transition: background .12s; white-space: nowrap;
    }
    button:hover { background: rgba(0,232,122,.1); }
    button.on { background: var(--accent); color: #000; font-weight: bold; }
    label { display: flex; align-items: center; gap: 4px; font-size: .75em; color: #555; }
    label span { color: var(--text); }
    select {
      background: var(--bg); color: var(--text);
      border: 1px solid #2a2a3a; padding: 3px 4px;
      font-family: monospace; font-size: .75em; border-radius: 2px;
    }
    input[type=range] { width: 60px; accent-color: var(--accent); }
    .note-big { font-size: 1.3em; color: var(--accent); font-weight: bold; min-width: 60px; text-align: center; }
    .note-editor { display: none; width: 100%; }
    .note-editor.open { display: block; }
    .note-editor-hdr {
      background: var(--panel); border: 1px solid #1e1e30; border-bottom: none;
      border-radius: 4px 4px 0 0; padding: 5px 10px; font-size: .72em; color: #555;
      display: flex; justify-content: space-between; align-items: center;
    }
    .note-grid {
      background: var(--panel); border: 1px solid #1e1e30; border-top: none;
      border-radius: 0 0 4px 4px; padding: 5px;
      display: grid; grid-template-columns: repeat(auto-fill, minmax(38px, 1fr)); gap: 2px;
    }
    .note-cell { display: flex; flex-direction: column; align-items: center; gap: 1px; }
    .note-cell .idx { font-size: .55em; color: #333; }
    .note-cell input {
      width: 100%; background: var(--bg); color: var(--accent);
      border: 1px solid #2a2a3a; text-align: center;
      font-family: monospace; font-size: .65em; padding: 3px 1px; border-radius: 2px;
    }
    .note-cell input:focus { border-color: var(--accent); outline: none; }
    #status { font-size: .7em; color: #888; text-align: center; padding: 2px 0; }
    .video-wrap:fullscreen, .video-wrap:-webkit-full-screen {
      width: 100vw !important; height: 100vh; background: #000;
      display: flex; align-items: center; justify-content: center;
    }
    .video-wrap:fullscreen canvas, .video-wrap:-webkit-full-screen canvas {
      width: min(100vw, calc(100vh * 4/3)) !important;
      height: min(100vh, calc(100vw * 3/4)) !important;
    }
    @media (max-width: 900px) {
      .duo-wrap { flex-direction: column; }
      .player-col { width: 100%; max-width: 640px; }
    }
  </style>
</head>
<body>
  <h1>⚡ SEB-WEBTHEREMINE-DUO</h1>

  <div class="duo-wrap">

    <!-- ── JOUEUR 1 ── -->
    <div class="player-col">
      <div class="player-label">— JOUEUR 1 —</div>
      <div id="video-wrap-1" class="video-wrap">
        <video id="videoel-1" width="640" height="480"></video>
        <canvas id="overlay-1" width="640" height="480"></canvas>
      </div>
      <div class="panel">
        <button id="btn-start-1">▶ START</button>
        <label><span>Gamme</span>
          <select id="sel-scale-1">
            <option value="M">Majeur</option><option value="mh">min. harm.</option>
            <option value="Penta">Pentatonique</option><option value="Myx">Mixolydien</option>
            <option value="Dor">Dorien</option>
          </select>
        </label>
        <label><span>Fond.</span>
          <select id="sel-root-1">
            <option value="60">DO4</option><option value="62">RÉ4</option>
            <option value="64">MI4</option><option value="65">FA4</option>
            <option value="67">SOL4</option><option value="69">LA4</option>
            <option value="71">SI4</option><option value="72">DO5</option>
          </select>
        </label>
        <label><span>Main</span>
          <select id="sel-hand-1"><option value="left">Gauche</option><option value="right">Droite</option></select>
        </label>
        <label><span>Cam</span><select id="sel-cam-1"><option value="">Auto</option></select></label>
        <div id="note-big-1" class="note-big">—</div>
        <button id="btn-edit-1" style="margin-left:auto">NOTES ▾</button>
        <button id="btn-fs-1" title="Plein écran">⛶</button>
      </div>
      <div id="note-editor-1" class="note-editor">
        <div class="note-editor-hdr"><span>Notes — FR ou MIDI</span><button id="btn-regen-1">↺ Regénérer</button></div>
        <div class="note-grid" id="note-grid-1"></div>
      </div>
    </div>

    <!-- ── JOUEUR 2 ── -->
    <div class="player-col">
      <div class="player-label">— JOUEUR 2 —</div>
      <div id="video-wrap-2" class="video-wrap">
        <video id="videoel-2" width="640" height="480"></video>
        <canvas id="overlay-2" width="640" height="480"></canvas>
      </div>
      <div class="panel">
        <button id="btn-start-2">▶ START</button>
        <label><span>Gamme</span>
          <select id="sel-scale-2">
            <option value="M">Majeur</option><option value="mh">min. harm.</option>
            <option value="Penta">Pentatonique</option><option value="Myx">Mixolydien</option>
            <option value="Dor">Dorien</option>
          </select>
        </label>
        <label><span>Fond.</span>
          <select id="sel-root-2">
            <option value="60">DO4</option><option value="62">RÉ4</option>
            <option value="64">MI4</option><option value="65">FA4</option>
            <option value="67">SOL4</option><option value="69">LA4</option>
            <option value="71">SI4</option><option value="72">DO5</option>
          </select>
        </label>
        <label><span>Main</span>
          <select id="sel-hand-2"><option value="left">Gauche</option><option value="right">Droite</option></select>
        </label>
        <label><span>Cam</span><select id="sel-cam-2"><option value="">Auto</option></select></label>
        <div id="note-big-2" class="note-big">—</div>
        <button id="btn-edit-2" style="margin-left:auto">NOTES ▾</button>
        <button id="btn-fs-2" title="Plein écran">⛶</button>
      </div>
      <div id="note-editor-2" class="note-editor">
        <div class="note-editor-hdr"><span>Notes — FR ou MIDI</span><button id="btn-regen-2">↺ Regénérer</button></div>
        <div class="note-grid" id="note-grid-2"></div>
      </div>
    </div>

  </div>
  <div id="status">Chargement des modèles MediaPipe…</div>
<script type="module">
(async () => {

// ── UTILITAIRES PARTAGÉS ──────────────────────────────────────────────────────
const SCALES = {
  M:[0,2,4,5,7,9,11], mh:[0,2,3,5,7,8,11], Penta:[0,2,4,7,9],
  Myx:[0,2,4,5,7,9,10], Dor:[0,2,3,5,7,9,10]
};
const FR = ['DO','DO#','RÉ','RÉ#','MI','FA','FA#','SOL','SOL#','LA','LA#','SI'];
function midiToName(m) { if (m<0||m>127) return '?'; return FR[m%12]+(Math.floor(m/12)-1); }
function midiToFreq(m) { return 440*Math.pow(2,(m-69)/12); }
function genNotes(root, mode, n=15) {
  const ivs=SCALES[mode]; const out=[]; let oct=0,i=0;
  while (out.length<n) {
    const note=root+oct*12+ivs[i%ivs.length];
    if (note<=127) out.push(note);
    if (++i%ivs.length===0) oct++;
    if (oct>6) break;
  }
  return out;
}
function parseFR(s) {
  const n=parseInt(s); if (!isNaN(n)&&n>=0&&n<=127) return n;
  const up=s.trim().toUpperCase();
  const map=[['SOL#',8],['DO#',1],['RÉ#',3],['RE#',3],['FA#',6],['LA#',10],
             ['SOL',7],['DO',0],['RÉ',2],['RE',2],['MI',4],['FA',5],['LA',9],['SI',11]];
  for (const [name,st] of map) {
    if (up.startsWith(name)) {
      const oct=parseInt(up.slice(name.length));
      if (!isNaN(oct)&&oct>=-1&&oct<=9) return (oct+1)*12+st;
    }
  }
  return null;
}


// ── MEDIAPIPE PARTAGÉ ─────────────────────────────────────────────────────────
const vision = await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.35/vision_bundle.mjs');
const { HandLandmarker, FilesetResolver } = vision;
const filesetResolver = await FilesetResolver.forVisionTasks(
  'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.35/wasm'
);
document.getElementById('status').textContent = 'Sébastien Gay - juin 2026';

// ── FACTORY JOUEUR ────────────────────────────────────────────────────────────
async function createPlayer(n) {
  const hl = await HandLandmarker.createFromOptions(filesetResolver, {
    baseOptions: {
      modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task',
      delegate: 'GPU'
    },
    runningMode: 'VIDEO',
    numHands: 2
  });

  const $ = id => document.getElementById(id + '-' + n);
  const video  = document.getElementById('videoel-'  + n);
  const overlay= document.getElementById('overlay-'  + n);
  const ctx2d  = overlay.getContext('2d');

  let notes      = genNotes(60, 'M');
  let running    = false;
  const mirrored = true;
  let handChoice = 'left';
  let activeIdx  = -1;
  let activeVol  = 0;
  let currentStream = null;
  let animFrame  = null;
  let lastT      = -1;

  // ── Éditeur de notes ──
  function buildNoteGrid() {
    const grid = $('note-grid');
    grid.innerHTML = '';
    notes.forEach((midi, i) => {
      const cell = document.createElement('div'); cell.className = 'note-cell';
      const idxEl = document.createElement('div'); idxEl.className = 'idx'; idxEl.textContent = i+1;
      const inp = document.createElement('input'); inp.type='text'; inp.value=midiToName(midi);
      inp.addEventListener('change', () => {
        const v=parseFR(inp.value);
        if (v!==null) { notes[i]=v; inp.value=midiToName(v); } else inp.value=midiToName(notes[i]);
      });
      cell.appendChild(idxEl); cell.appendChild(inp); grid.appendChild(cell);
    });
  }
  buildNoteGrid();

  function regenFromScale() { notes=genNotes(parseInt($('sel-root').value),$('sel-scale').value); buildNoteGrid(); }
  $('btn-edit').addEventListener('click', () => $('note-editor').classList.toggle('open'));
  $('btn-regen').addEventListener('click', regenFromScale);
  $('sel-scale').addEventListener('change', regenFromScale);
  $('sel-root').addEventListener('change', regenFromScale);
  $('sel-hand').addEventListener('change', e => { handChoice = e.target.value; });

  // ── Caméra ──
  const selCam = $('sel-cam');
  async function enumerateCameras() {
    try {
      const devices = await navigator.mediaDevices.enumerateDevices();
      const cams = devices.filter(d => d.kind==='videoinput');
      const prev = selCam.value;
      selCam.innerHTML = '<option value="">Auto</option>';
      cams.forEach((cam,i) => {
        const o=document.createElement('option');
        o.value=cam.deviceId; o.textContent=cam.label||`Caméra ${i+1}`;
        if (cam.deviceId===prev) o.selected=true;
        selCam.appendChild(o);
      });
    } catch(_) {}
  }
  await enumerateCameras();

  async function startCamera() {
    if (currentStream) { currentStream.getTracks().forEach(t=>t.stop()); currentStream=null; }
    const constraints = { video: {
      width:{ideal:640}, height:{ideal:480},
      ...(selCam.value ? {deviceId:{exact:selCam.value}} : {})
    }};
    currentStream = await navigator.mediaDevices.getUserMedia(constraints);
    video.srcObject = currentStream;
    await video.play();
    await enumerateCameras();
  }

  selCam.addEventListener('change', async () => {
    if (running) { cancelAnimationFrame(animFrame); await startCamera(); frameLoop(); }
  });
  // ── MIDI ──
  function playNote(idx, vol) {
    const active = running && idx >= 0 && vol > 0.02;
    window.parent.postMessage({
      type: 'seb-midi',
      payload: {
        kind: 'note',
        channel: Number(n) - 1,
        active,
        note: active ? notes[idx] : 0,
        velocity: active ? Math.max(0, Math.min(1, vol)) : 0,
        expression: active ? Math.max(0, Math.min(1, vol)) : 0
      }
    }, window.location.origin);
    activeIdx = active ? idx : -1;
    activeVol = active ? vol : 0;
  }



  // ── Dessin ──
  function drawFrame(res) {
    const W=overlay.width, H=overlay.height, N=notes.length, zW=W/N;
    const fscale = W/(overlay.offsetWidth||W);
    ctx2d.clearRect(0,0,W,H);
    ctx2d.save();
    ctx2d.translate(W,0); ctx2d.scale(-1,1);
    ctx2d.drawImage(video,0,0,W,H);
    ctx2d.restore();

    for (let i=0;i<N;i++) {
      const x=i*zW, active=i===activeIdx;
      ctx2d.fillStyle='rgba(255,255,255,0.025)'; ctx2d.fillRect(x,0,zW-1,H);
      if (active) { ctx2d.fillStyle='rgba(0,232,122,0.25)'; ctx2d.fillRect(x,H-activeVol*H,zW-1,activeVol*H); }
      ctx2d.strokeStyle=active?'#00e87a':'#252530'; ctx2d.lineWidth=active?2:1;
      ctx2d.beginPath(); ctx2d.moveTo(x,0); ctx2d.lineTo(x,H); ctx2d.stroke();
      ctx2d.fillStyle=active?'#00e87a':'#2e2e44';
      const fsz=Math.round(10*fscale);
      ctx2d.font=active?`bold ${fsz+1}px monospace`:`${fsz}px monospace`;
      ctx2d.textAlign='center';
      ctx2d.fillText(midiToName(notes[i]),x+zW/2,fsz+4);
    }

    let controlled=false;
    if (res.landmarks && res.handednesses) {
      for (let h=0;h<res.handednesses.length;h++) {
        const side=res.handednesses[h][0].categoryName;
        const lm=res.landmarks[h];
        const isCtrl = handChoice==='left' ? side==='Left' : side==='Right';
        const cx=lm.reduce((s,pt)=>s+pt.x,0)/lm.length;
        const cy=lm.reduce((s,pt)=>s+pt.y,0)/lm.length;
        const sx=1-cx; // mirrored always
        const px=sx*W, py=cy*H;
        ctx2d.beginPath(); ctx2d.arc(px,py,zW/2,0,Math.PI*2);
        ctx2d.fillStyle=isCtrl?'rgba(0,232,122,0.85)':'rgba(255,102,51,0.6)'; ctx2d.fill();
        if (isCtrl && !controlled) {
          controlled=true;
          const idx=Math.min(N-1,Math.floor(sx*N));
          const vol=Math.max(0,Math.min(1,1-cy*1.35));
          playNote(idx,vol);
          $('note-big').textContent=midiToName(notes[idx]);
          ctx2d.fillStyle=`rgba(0,232,122,${0.2+vol*0.5})`;
          ctx2d.fillRect(W-10,H-vol*H*0.85,8,vol*H*0.85);
        }
      }
    }
    if (!controlled && running) { playNote(-1,0); $('note-big').textContent='—'; }
  }

  function frameLoop() {
    if (!running) return;
    if (video.readyState>=2 && video.currentTime!==lastT) {
      lastT=video.currentTime;
      drawFrame(hl.detectForVideo(video,performance.now()));
    }
    animFrame=requestAnimationFrame(frameLoop);
  }

  // ── Start / Stop ──
  const btnStart=$('btn-start');
  btnStart.addEventListener('click', async () => {
    if (!running) {
      await startCamera();
      running=true; frameLoop();
      btnStart.textContent='⏹ STOP'; btnStart.classList.add('on');
    } else {
      running=false; cancelAnimationFrame(animFrame); animFrame=null;
      playNote(-1,0);
      if (currentStream) { currentStream.getTracks().forEach(t=>t.stop()); currentStream=null; }
      video.srcObject=null;
      btnStart.textContent='▶ START'; btnStart.classList.remove('on');
      ctx2d.clearRect(0,0,overlay.width,overlay.height);
      $('note-big').textContent='—';
    }
  });

  // ── Plein écran ──
  const videoWrap=document.getElementById('video-wrap-'+n);
  $('btn-fs').addEventListener('click', () => {
    if (!document.fullscreenElement) videoWrap.requestFullscreen().catch(()=>{});
    else document.exitFullscreen();
  });
  document.addEventListener('fullscreenchange', () => {
    if (document.fullscreenElement===videoWrap) {
      $('btn-fs').textContent='⊡'; $('btn-fs').title='Quitter plein écran';
    } else if (!document.fullscreenElement) {
      $('btn-fs').textContent='⛶'; $('btn-fs').title='Plein écran';
    }
  });
}

try { const _s = await navigator.mediaDevices.getUserMedia({ video: true }); _s.getTracks().forEach(t => t.stop()); } catch(_) {}
await createPlayer('1');
await createPlayer('2');

})();
</script>
</body>
</html>
